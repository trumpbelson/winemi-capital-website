<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Demand and supply zone anatomy</title>
  <text x="160" y="28" fill="#b8956a" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Demand zone</text>
  <polyline points="40,160 80,150 110,145 140,140 140,100 180,40" fill="none" stroke="#5a9a7a" stroke-width="2.5"/>
  <rect x="100" y="100" width="60" height="45" rx="3" fill="#5a9a7a" opacity="0.2" stroke="#b8956a" stroke-width="1.5"/>
  <text x="130" y="125" fill="#b8956a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">base</text>
  <text x="200" y="50" fill="#5a9a7a" font-size="10" font-family="system-ui,sans-serif">departure</text>
  <text x="160" y="210" fill="#8a8880" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">buying interest region</text>
  <text x="480" y="28" fill="#b8956a" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Supply zone</text>
  <polyline points="360,40 400,50 430,55 460,60 460,100 500,160" fill="none" stroke="#c07070" stroke-width="2.5"/>
  <rect x="420" y="55" width="60" height="45" rx="3" fill="#c07070" opacity="0.2" stroke="#b8956a" stroke-width="1.5"/>
  <text x="450" y="80" fill="#b8956a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">base</text>
  <text x="520" y="155" fill="#c07070" font-size="10" font-family="system-ui,sans-serif">departure</text>
  <text x="480" y="210" fill="#8a8880" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">selling interest region</text>
</svg>