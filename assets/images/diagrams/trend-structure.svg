<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Uptrend and downtrend structure</title>
  <text x="160" y="28" fill="#b8956a" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Uptrend — HH / HL</text>
  <polyline points="40,180 80,120 110,150 150,80 180,110 230,40" fill="none" stroke="#5a9a7a" stroke-width="2.5"/>
  <text x="150" y="70" fill="#5a9a7a" font-size="10" font-family="system-ui,sans-serif">HH</text>
  <text x="110" y="165" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif">HL</text>
  <text x="180" y="125" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif">HL</text>
  <text x="230" y="35" fill="#5a9a7a" font-size="10" font-family="system-ui,sans-serif">HH</text>
  <text x="480" y="28" fill="#b8956a" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Downtrend — LH / LL</text>
  <polyline points="360,40 400,100 430,70 470,140 500,110 550,180" fill="none" stroke="#c07070" stroke-width="2.5"/>
  <text x="400" y="95" fill="#c07070" font-size="10" font-family="system-ui,sans-serif">LH</text>
  <text x="470" y="155" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif">LL</text>
  <text x="500" y="105" fill="#c07070" font-size="10" font-family="system-ui,sans-serif">LH</text>
  <text x="550" y="195" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif">LL</text>
  <text x="320" y="210" fill="#8a8880" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">Structure of swing points defines the regime</text>
</svg>