<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fresh versus depleted zones</title>
  <text x="160" y="28" fill="#b8956a" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Fresh zone (FTB)</text>
  <polyline points="40,160 70,100 100,100 130,100 160,50 190,50 220,50 250,50" fill="none" stroke="#5a9a7a" stroke-width="2.5"/>
  <rect x="90" y="92" width="50" height="16" rx="2" fill="none" stroke="#b8956a" stroke-width="1.5"/>
  <circle cx="220" cy="50" r="6" fill="#b8956a"/>
  <text x="220" y="78" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">first return</text>
  <text x="160" y="200" fill="#8a8880" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">higher informational value</text>
  <text x="480" y="28" fill="#b8956a" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Depleted zone</text>
  <polyline points="360,160 390,100 420,100 450,70 480,100 510,70 540,100 570,50" fill="none" stroke="#8a8880" stroke-width="2.5"/>
  <rect x="410" y="92" width="50" height="16" rx="2" fill="none" stroke="#8a8880" stroke-width="1.5"/>
  <circle cx="450" cy="70" r="4" fill="#8a8880"/>
  <circle cx="510" cy="70" r="4" fill="#8a8880"/>
  <circle cx="540" cy="100" r="4" fill="#8a8880"/>
  <text x="480" y="200" fill="#8a8880" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">multiple tests weaken residual interest</text>
</svg>