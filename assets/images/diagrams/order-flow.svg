<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Order flow footprints</title>
  <text x="100" y="28" fill="#b8956a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Imbalance</text>
  <polyline points="40,150 60,140 80,100 100,60 120,40" fill="none" stroke="#5a9a7a" stroke-width="3"/>
  <text x="100" y="175" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">strong departure</text>
  <text x="280" y="28" fill="#b8956a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Absorption</text>
  <line x1="220" y1="100" x2="340" y2="100" stroke="#b8956a" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="240,70 250,95 260,75 270,100 280,80 290,100 300,85 310,100 320,90" fill="none" stroke="#8a8880" stroke-width="2"/>
  <text x="280" y="175" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">held despite pressure</text>
  <text x="500" y="28" fill="#b8956a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">Liquidity pool</text>
  <line x1="440" y1="70" x2="560" y2="70" stroke="#c07070" stroke-width="1.5"/>
  <text x="500" y="62" fill="#c07070" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">stops above high</text>
  <polyline points="460,120 480,100 500,55 520,100 540,120" fill="none" stroke="#8a8880" stroke-width="2"/>
  <text x="500" y="175" fill="#8a8880" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">sweep then reverse</text>
</svg>