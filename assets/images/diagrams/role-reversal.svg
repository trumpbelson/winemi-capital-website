  <text x="560" y="102" fill="#b8956a" font-size="11" font-family="system-ui,sans-serif" text-anchor="end">level</text>
  <polyline points="80,150 140,140 200,130 250,110 280,70 320,60 360,70 400,100 440,110 480,100 520,90" fill="none" stroke="#5a9a7a" stroke-width="2.5"/>
