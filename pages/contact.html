<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | WINEMI CAPITAL.</title>
  <meta name="description" content="Contact WINEMI CAPITAL." />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/nav.css" />
  <link rel="stylesheet" href="../assets/css/logo.css" />
  <link rel="stylesheet" href="../assets/css/glass.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('winemi-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <header class="site-header" role="banner"></header>
  <main>
    <section class="section">
      <div class="container">
        <p class="label">Contact</p>
        <h1 class="heading-1">Get in touch</h1>
        <p class="body-large" style="max-width:36rem;">For institutional enquiries, education pathways, or general questions.</p>
        <div class="grid-2" style="margin-top:2.5rem;align-items:start;">
          <form id="contact-form" class="card" style="padding:1.5rem;">
            <label class="body-small" for="name">Name</label>
            <input id="name" name="name" required style="width:100%;margin:0.35rem 0 1rem;padding:0.65rem;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);color:inherit;" />
            <label class="body-small" for="email">Email</label>
            <input id="email" name="email" type="email" required style="width:100%;margin:0.35rem 0 1rem;padding:0.65rem;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);color:inherit;" />
            <label class="body-small" for="message">Message</label>
            <textarea id="message" name="message" rows="5" required style="width:100%;margin:0.35rem 0 1.25rem;padding:0.65rem;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);color:inherit;"></textarea>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p id="contact-feedback" class="body-small" hidden style="margin-top:1rem;"></p>
          </form>
          <div>
            <article class="card" style="padding:1.35rem;">
              <h3 class="card-title">Channels</h3>
              <p class="body-small">WhatsApp: <a href="https://wa.me/233503100519" rel="noopener">+233 50 310 0519</a></p>
              <p class="body-small">Telegram: <a href="https://t.me/WinemiCapital" rel="noopener">@WinemiCapital</a></p>
              <p class="body-small">X: <a href="https://x.com/WinemiCapital" rel="noopener">@WinemiCapital</a></p>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="../index.html" class="logo" aria-label="WINEMI CAPITAL. home"><span class="logo-mark" aria-hidden="true"></span></a>
        <p class="footer-tag">Institutional discipline. Global markets.</p>
      </div>
      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </div>
      <p class="footer-copy">&copy; <span class="year"></span> WINEMI CAPITAL. All rights reserved.</p>
    </div>
  </footer>
  <script>document.querySelectorAll('.year').forEach(function (el) { el.textContent = new Date().getFullYear(); });</script>
  <script src="../assets/js/site-nav.js"></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
