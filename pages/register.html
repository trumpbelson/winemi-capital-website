<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | WINEMI CAPITAL.</title>
  <meta name="description" content="Client portal registration for WINEMI CAPITAL." />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/nav.css" />
  <link rel="stylesheet" href="../assets/css/logo.css" />
  <link rel="stylesheet" href="../assets/css/glass.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('winemi-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <header class="site-header" role="banner"></header>
  <main>
    <section class="section">
      <div class="container" style="max-width:480px;">
        <p class="label">Portal</p>
        <h1 class="heading-2">Register</h1>
        <p class="body-base">Client registration is not yet open on this public site. Contact the firm to discuss access and onboarding.</p>
        <p class="mt-4">
          <a href="contact.html" class="btn btn-primary">Contact</a>
          <a href="login.html" class="btn btn-secondary">Sign in</a>
        </p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="../index.html" class="logo" aria-label="WINEMI CAPITAL. home"><span class="logo-mark" aria-hidden="true"></span></a>
        <p class="footer-tag">Institutional discipline. Global markets.</p>
      </div>
      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </div>
      <p class="footer-copy">&copy; <span class="year"></span> WINEMI CAPITAL. All rights reserved.</p>
    </div>
  </footer>
  <script>document.querySelectorAll('.year').forEach(function (el) { el.textContent = new Date().getFullYear(); });</script>
  <script src="../assets/js/site-nav.js"></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
