          <div class="tv-panel" data-panel="overview"><div class="tradingview-widget-container" style="height:520px;"><div class="tradingview-widget-container__widget" style="height:520px;"></div><script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>{"colorTheme":"dark","dateRange":"1M","showChart":true,"locale":"en","width":"100%","height":"100%","isTransparent":true,"showSymbolLogo":true,"tabs":[{"title":"Indices","symbols":[{"s":"FOREXCOM:SPXUSD","d":"S&P 500"},{"s":"FOREXCOM:NSXUSD","d":"NASDAQ 100"},{"s":"FOREXCOM:DJI","d":"Dow 30"}]},{"title":"Rates & FX","symbols":[{"s":"TVC:US10Y","d":"US 10Y"},{"s":"TVC:DXY","d":"DXY"},{"s":"FX:EURUSD","d":"EUR/USD"}]},{"title":"Commodities","symbols":[{"s":"TVC:GOLD","d":"Gold"},{"s":"TVC:USOIL","d":"WTI"}]}]}</script></div></div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    (function () {
      var panels = document.querySelectorAll('.tv-panel');
      var tabs = document.querySelectorAll('.tv-tool-tab');
      var symbolTabs = document.querySelectorAll('.instrument-tab');
      var chartEl = document.getElementById('tradingview-widget');
      var current = 'FOREXCOM:SPXUSD';
      var chartMounted = false;
      function theme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
      function mountChart(symbol) {
        if (!chartEl || typeof TradingView === 'undefined') return;
        current = symbol || current;
        chartEl.innerHTML = '';
        new TradingView.widget({ autosize: true, symbol: current, interval: '60', timezone: 'Etc/UTC', theme: theme(), style: '1', locale: 'en', toolbar_bg: '#1c1c1f', enable_publishing: false, allow_symbol_change: true, hide_side_toolbar: false, container_id: 'tradingview-widget', backgroundColor: theme() === 'light' ? '#f7f5f0' : '#0e0e10', gridColor: 'rgba(184,149,106,0.08)' });
        chartMounted = true;
      }
      function showPanel(id) {
        panels.forEach(function (p) { p.classList.toggle('active', p.getAttribute('data-panel') === id); });
        tabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-tv-panel') === id); });
        var symRow = document.getElementById('tv-symbol-tabs');
        if (symRow) symRow.style.display = (id === 'chart' || id === 'technicals') ? 'flex' : 'none';
        if (id === 'chart' && !chartMounted) mountChart(current);
      }
      tabs.forEach(function (tab) { tab.addEventListener('click', function () { showPanel(tab.getAttribute('data-tv-panel')); }); });
      symbolTabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          symbolTabs.forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
          mountChart(tab.getAttribute('data-symbol'));
        });
      });
      function boot() { if (typeof TradingView !== 'undefined') mountChart(current); else setTimeout(boot, 200); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
  </script>
