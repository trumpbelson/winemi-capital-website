<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal | WINEMI CAPITAL.</title>
  <meta name="description" content="Client portal sign-in for WINEMI CAPITAL." />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/nav.css" />
  <link rel="stylesheet" href="../assets/css/logo.css" />
  <link rel="stylesheet" href="../assets/css/glass.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('winemi-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <header class="site-header" role="banner"></header>
  <main>
    <section class="section">
      <div class="container" style="max-width:420px;">
        <p class="label">Portal</p>
        <h1 class="heading-2">Sign in</h1>
        <p class="body-base">The client portal is not connected on this public deployment. Contact the firm for access.</p>
        <form class="card" style="padding:1.5rem;margin-top:1.5rem;" onsubmit="return false;">
          <label class="body-small" for="email">Email</label>
          <input id="email" type="email" autocomplete="username" style="width:100%;margin:0.35rem 0 1rem;padding:0.65rem;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);color:inherit;" />
          <label class="body-small" for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" style="width:100%;margin:0.35rem 0 1.25rem;padding:0.65rem;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);color:inherit;" />
          <button type="button" class="btn btn-primary" style="width:100%;">Sign in</button>
          <p class="body-small" style="margin-top:1rem;">No account? <a href="register.html">Register</a> · <a href="contact.html">Contact</a></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="../index.html" class="logo" aria-label="WINEMI CAPITAL. home"><span class="logo-mark" aria-hidden="true"></span></a>
        <p class="footer-tag">Institutional discipline. Global markets.</p>
      </div>
      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </div>
      <p class="footer-copy">&copy; <span class="year"></span> WINEMI CAPITAL. All rights reserved.</p>
    </div>
  </footer>
  <script>document.querySelectorAll('.year').forEach(function (el) { el.textContent = new Date().getFullYear(); });</script>
  <script src="../assets/js/site-nav.js"></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
